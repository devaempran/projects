name: decision-router

on:
  push:
    paths: ["decision-router/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["decision-router/**", ".github/workflows/ci.yml"]

jobs:
  service:
    # The API tests fake the model, so they need neither a GPU nor llama-cpp-python.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-router/service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask numpy waitress pytest ruff
      - run: ruff check .
      - run: pytest

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-router/pipeline
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_PORT: "6379"   # the tests default to 6380 (the README's Docker command); the environment overrides it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install redis pytest ruff
      - run: ruff check .
      - run: pytest   # includes the slow end-to-end tests (about three minutes)

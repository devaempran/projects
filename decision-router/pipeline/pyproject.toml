[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-pipeline"
version = "0.1.0"
description = "Routes events from a Redis stream through decisionLM to one stream per decided option"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["redis>=5.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pipeline = "pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pipeline.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end-to-end runs that take minutes (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
